name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: the repositories and the validators drift without a commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.8" } # oldest supported: the scripts declare requires-python >= 3.8
          - { os: ubuntu-24.04, python: "3.x" }
          - { os: windows-latest, python: "3.x" } # console encoding and path separators
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # unit tests, version consistency (and tag == version on tag builds), fixture run offline
      - run: python -m unittest discover -s tests -v

  validate:
    name: Skill and plugin manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Agent Skills spec (skills-ref)
        run: |
          pip install skills-ref==0.1.1
          python -m skills_ref.cli validate skills/android-update-deps
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Claude Code plugin and marketplace (strict)
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate --strict .
      - name: gh skill publish (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  online:
    name: Planner against the live repositories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Policy invariants on the fixture (tests/test_online.py)
        env:
          PLAN_ONLINE: "1"
        run: python -m unittest discover -s tests -p "test_online.py" -v
